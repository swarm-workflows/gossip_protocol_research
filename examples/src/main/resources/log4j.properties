log4j.rootLogger=OFF, STDOUT
log4j.logger.com.vrg.rapid.Cluster=OFF
log4j.logger.com.vrg.rapid.MembershipService=OFF
log4j.logger.com.vrg.rapid.Paxos=OFF
log4j.logger.com.vrg.rapid.FastPaxos=OFF
log4j.logger.com.vrg.rapid.SharedResources=OFF
log4j.logger.com.vrg.rapid.messaging.impl.Retries=OFF
log4j.logger.io.grpc.internal.ManagedChannelOrphanWrapper=OFF
log4j.appender.STDOUT=org.apache.log4j.ConsoleAppender
log4j.appender.STDOUT.layout=org.apache.log4j.PatternLayout
log4j.appender.STDOUT.layout.ConversionPattern=%5p [%t] (%F:%L) - %m%n